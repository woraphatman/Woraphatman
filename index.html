<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nobxx profile keyboard</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page, #FAF4E6); }
    canvas { display: block; }
  </style>
  <script>
    // paint the page in the theme colour before the canvas exists (night = GitHub dark); without &theme the live page follows the visitor's setting
    (() => {
      const q = new URLSearchParams(location.search);
      const theme = q.get('theme') ?? (q.get('still') !== '1' && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
      if (theme === 'night') document.documentElement.style.setProperty('--page', '#0d1117');
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module" src="./main.js"></script>
</body>
</html>
