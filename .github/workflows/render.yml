# Renders the profile banner (two looping GIFs of the keyboard animation, drawn by software GL on the runner) and
# force-pushes it, with the live page and data.json, as the orphan `output` branch that README.md and GitHub Pages read.
#
#   prepare   fetch the contribution data, test it, decide whether the banner has to be rendered
#   render    one runner per theme (day, night): Chrome on Mesa llvmpipe under xvfb draws the frames, sharp encodes the GIF
#   publish   assemble dist/ and force-push it as the `output` branch
name: Render banner

on:
  schedule:
    - cron: '17 * * * *' # hourly, off the busy minute; skips the render when the data is unchanged
  push:
    branches: [master]
    paths: # render code only: README, docs and tests do not change the picture
      - index.html
      - main.js
      - src/**
      - capture-anim.mjs
      - capture-lib.mjs
      - fetch_data.mjs
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/render.yml
  workflow_dispatch:
    inputs:
      probe:
        description: 'Probe: render only this many distinct frames per theme, upload them and stop without publishing (0 = full run)'
        type: number
        default: 0
      from:
        description: 'Probe only: index of the first distinct frame to render'
        type: number
        default: 0
      samples:
        description: 'Accumulation samples per frame (0 = the CI profile default)'
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: render-banner
  cancel-in-progress: false

env:
  TZ: Asia/Bangkok # the OLED shows "updated HH:MM" in the owner's time zone
  OWNER: ${{ github.repository_owner }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      render: ${{ steps.skip.outputs.render }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node fetch_data.mjs

      - name: Test
        run: npm test

      - name: Look up the published data
        run: |
          git fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" output \
            && git show FETCH_HEAD:data.json > published-data.json \
            || echo "No published data yet."

      - name: Decide whether to render
        id: skip
        run: node scripts/should-render.mjs --fresh=data.json --published=published-data.json --event="$GITHUB_EVENT_NAME"

      - name: Keep the data for the render jobs
        if: ${{ steps.skip.outputs.render == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-json
          path: data.json
          retention-days: 1
          if-no-files-found: error

  render:
    needs: prepare
    if: ${{ needs.prepare.outputs.render == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        theme: [day, night]
    env:
      THEME: ${{ matrix.theme }}
      PROBE: ${{ inputs.probe }}
      FROM: ${{ inputs.from }}
      SAMPLES: ${{ inputs.samples }}
      LIBGL_ALWAYS_SOFTWARE: '1' # no GPU on the runner: Mesa's llvmpipe, which draws this scene about 5x faster than Chrome's SwiftShader
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data-json

      - name: Make sure the software GL stack is installed
        run: |
          if ! command -v xvfb-run >/dev/null || ! dpkg -s libgl1-mesa-dri libglx-mesa0 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
          fi

      - name: Render the ${{ matrix.theme }} banner
        run: |
          args=(--gl=mesa --theme="$THEME" --profile=ci --formats=gif --out=out/ci)
          if [ "${SAMPLES:-0}" != "0" ]; then args+=(--samples="$SAMPLES"); fi
          if [ "${PROBE:-0}" != "0" ]; then args+=(--limit="$PROBE" --from="${FROM:-0}"); fi
          xvfb-run -a -s "-screen 0 1920x1080x24" node capture-anim.mjs "${args[@]}"

      - name: Keep the GIF
        if: ${{ !(inputs.probe > 0) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banner-${{ matrix.theme }}
          path: out/ci/banner-${{ matrix.theme }}.gif
          retention-days: 1
          if-no-files-found: error

      - name: Keep the probe frames
        if: ${{ inputs.probe > 0 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-frames-${{ matrix.theme }}
          path: out/ci/frames-${{ matrix.theme }}
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [prepare, render]
    if: ${{ needs.prepare.outputs.render == 'true' && !(inputs.probe > 0) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data-json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: banner-*
          path: out/ci
          merge-multiple: true

      - name: Build dist
        run: node scripts/build-dist.mjs --gifs=out/ci

      - name: Publish the output branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          asof=$(jq -r .asOf data.json)
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Render banner for ${asof}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
